# Provider-neutral id: this plugin supports GitHub and GitLab equally and is not
# tied to either. Renamed from the upstream "gitlab-ci-status" (see README credits).
id = "git-status"
name = "Git CI + Review Status"
version = "0.4.0"
min_herdr_version = "0.8.0"   # workspace report-metadata (sidebar tokens)
description = "CI and code-review status for GitHub and GitLab in herdr: a live colored dot, PR number, and review-state glyph published as `gst_ci_*`/`gst_review_*`/`gst_pr` sidebar metadata tokens (labels are never touched), plus on-demand CI-detail and 'My PRs' panes. Auto-detects the provider from the repo's origin host."
platforms = ["linux", "macos"]

[[actions]]
id = "open"
title = "Open CI status pane"
contexts = ["workspace"]
command = ["bash", "open.sh"]

[[actions]]
id = "start"
title = "Start CI status dots"
command = ["bash", "poller-ctl.sh", "start"]

[[actions]]
id = "stop"
title = "Stop CI status dots"
command = ["bash", "poller-ctl.sh", "stop"]

[[actions]]
id = "toggle"
title = "Toggle CI status dots"
command = ["bash", "poller-ctl.sh", "toggle"]

[[actions]]
id = "ensure"
title = "Ensure CI status dots poller is running"
command = ["bash", "poller-ctl.sh", "ensure"]

[[actions]]
id = "open-pr"
title = "Open My PRs pane"
contexts = ["workspace"]
command = ["bash", "open-pr.sh"]

[[panes]]
id = "ci"
title = "CI status"
placement = "split"
command = ["bash", "ci-pane.sh"]

[[panes]]
id = "pr"
title = "My PRs"
placement = "split"
command = ["bash", "pr-pane.sh"]

# NOTE: herdr 0.7 does NOT bind keys declared in a plugin manifest, so there are no
# [[keys.command]] entries here. Bind keys in your ~/.config/herdr/config.toml instead:
#
#   [[keys.command]]
#   key = "prefix+i"
#   type = "shell"
#   command = "herdr plugin action invoke git-status.toggle"
#
#   [[keys.command]]
#   key = "prefix+shift+i"
#   type = "shell"
#   command = "herdr plugin action invoke git-status.open"
#
# Then run: herdr server reload-config
