id = "gitlab-ci-status"
name = "GitLab CI Status"
version = "0.3.0"
min_herdr_version = "0.7.0"
description = "GitLab CI status in herdr: a live colored dot on each space's label, plus an on-demand detail pane."
platforms = ["linux", "macos"]

[[actions]]
id = "open"
title = "Open GitLab CI status"
contexts = ["workspace"]
command = ["bash", "open.sh"]

[[actions]]
id = "start"
title = "Start GitLab CI status dots"
command = ["bash", "poller-ctl.sh", "start"]

[[actions]]
id = "stop"
title = "Stop GitLab CI status dots"
command = ["bash", "poller-ctl.sh", "stop"]

[[actions]]
id = "toggle"
title = "Toggle GitLab CI status dots"
command = ["bash", "poller-ctl.sh", "toggle"]

[[panes]]
id = "ci"
title = "GitLab CI"
placement = "split"
command = ["bash", "ci-pane.sh"]

# NOTE: herdr 0.7 does NOT bind keys declared in a plugin manifest, so there are no
# [[keys.command]] entries here. Bind keys in your ~/.config/herdr/config.toml instead:
#
#   [[keys.command]]
#   key = "prefix+i"
#   type = "shell"
#   command = "herdr plugin action invoke gitlab-ci-status.toggle"
#
#   [[keys.command]]
#   key = "prefix+shift+i"
#   type = "shell"
#   command = "herdr plugin action invoke gitlab-ci-status.open"
#
# Then run: herdr server reload-config
